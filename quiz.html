<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="css/quiz.css" type="text/css">
        <script type="text/javascript" src="js/proiect.js" defer></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&family=Teko:wght@300..700&display=swap" rel="stylesheet">
        <title>Quiz ^._.^</title>
    </head>
    <body>
        <main>
        <header>
         <h1>Quiz</h1>
         <a href="homepage.html">Acasa</a>
        </header>
        <br><br><br>
        <div id="auth">
            <form id="loginForm">
                <label> Username:</label>
                <input type="text" id="loginUsername" required><br>
                <label> Password:</label>
                <input type="password" id="loginPassword" required>
                <br>
                <button type="submit">Login</button> 
            </form>
            </div>

            <p id="welcome"></p>
            <button id="logoutBtn" style="display:none;">Logout</button>
            <br><br>
            
            <form method="post" id="formular">
                <fieldset>
                    <legend>Ce personaj din joc te reprezinta?</legend>
                    <p>Care e personajul tau preferat?</p>
                    <input type="radio" name="1" value="3" required>
                    <label>Ellie</label><br>
                    <input type="radio" name="1" value="2">
                    <label>Tess</label><br>
                    <input type="radio" name="1" value="4">
                    <label>Joel</label><br>
                    <input type="radio" name="1" value="1">
                    <label>Dina</label><br>
                    <input type="radio" name="1" value="5">
                    <label>Abby</label>
                    <p>Care este animalul tau mitic preferat?</p>
                    <input type="radio" value="5" name="2" required>
                    <label>Pheonix</label><br>
                    <input type="radio" value="1" name="2">
                    <label>Unicorn</label><br>
                    <input type="radio" value="4" name="2">
                    <label>Minotaur</label><br>
                    <input type="radio" name="2" value="3">
                    <label>Dragon</label><br>
                    <input type="radio" name="2" value="2">
                    <label>Grifon</label>
                    <p>In ce element al naturii te regasesti cel mai mult?</p>
                    <input type="radio" name="3" value="3" required>
                    <label>Apa</label><br>
                    <input type="radio" name="3" value="2">
                    <label>Foc</label><br>
                    <input type="radio" name="3" value="4">
                    <label>Pamant</label><br>
                    <input type="radio" name="3" value="1">
                    <label>Aer</label>
                    <p>Ce fel de culori iti plac?</p>
                    <input type="radio" name="4" value="3" required>
                    <label>Reci si inchise</label><br>
                    <input type="radio" name="4" value="2">
                    <label>Neutre si inchise</label><br>
                    <input type="radio" name="4" value="4">
                    <label>Calde si inchise</label><br>
                    <input type="radio" name="4" value="1">
                    <label>Calde si deschise</label><br>
                    <input type="radio" name="4" value="5">
                    <label>Reci si deschise</label>
                    <p>Cat de sportiv esti?</p>
                    <div class="slidecontainer">
                    <input type="range" min="1" max="5" value="3" class="slider" id="range" name="5">
                    </div>
                </fieldset>

                <br><br><br>
                <fieldset>
                    <legend>
                        Detalii personale
                    </legend>
                    <ul>
                    <li><label>Nume intreg</label><br>
                    <input type="text" id="demo" required>
                    </li>
                    <li><label>Inaltime (in cm)</label><br>
                    <input type="number" min="100" max="200" required></li>
                    <li><label>Numar de telefon</label><br><input type ="tel" placeholder="07xxxxxxxx"></li>
                    
                    <li><label>Care e dinozaurul tau preferat si de ce?</label> <br>
                    <textarea></textarea></li> </ul>

                </fieldset>
                <br>
                <p id="rezultat"></p>
            </form>
            
        
        <div id="canvas-container">
        <canvas id="shroom" width="300" height="60"></canvas>
        </div>
        <p id="da">Vezi rezultatul !</p>

        <br><br>
        <div class="istoric-container">
            <button id="btnIstoric" type="button">Istoric</button>
            <button id="btnStergeIstoric" type="button" style="display:none; background-color: #ad4337;">Sterge istoric</button>
            
            <ul id="listaIstoric"></ul>
        </div>
        </main>
    </body>
</html>
